name: CI

# Filet de non-régression : typecheck + suite de tests COMPLÈTE à chaque push,
# sur main ET sur toute branche, + sur chaque pull request. Aucun secret, aucune
# variable d'environnement — ni le typecheck ni les tests n'en ont besoin.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Tests (vitest run)
        run: npm test
